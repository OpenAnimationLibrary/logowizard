name: windows release

# Push a tag like v0.1.0 to build the Windows app and publish a GitHub release.
# Run it by hand from the Actions tab to get the build as a workflow artifact only.
# One-time bootstrap: deliberately create release/v0.1.0 at the source commit
# already on main to complete the user's existing empty v0.1.0 release. After
# build and smoke checks, an exact SHA lease replaces its license-only tag and
# adds assets without replacing the user's title/body or any existing assets.
on:
  push:
    tags: ["v*"]
    branches: ["release/v0.1.0"]
  workflow_dispatch:

concurrency:
  group: logowizard-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: local/fonts
          key: fonts-${{ hashFiles('data/fonts/manifest.csv') }}
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup is required for the release installer"
          }
      - name: Build
        shell: pwsh
        env:
          LW_PYTHON: python
        run: packaging/build_windows.ps1
      - name: Smoke test the build
        shell: pwsh
        run: python packaging/smoke_windows.py dist/LogoWizard/LogoWizard.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LogoWizard-windows
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*-setup.exe
      - name: Complete the existing first release
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.1.0'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python packaging/complete_first_release.py
      - name: Release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # This version's section of CHANGELOG.md, from its heading to the next one.
          $lines = Get-Content CHANGELOG.md
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag does not match project version $version" }
          $start = ($lines | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $next = ($lines | Select-Object -Skip $start | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $end = if ($next) { $start + $next - 2 } else { $lines.Count - 1 }
          $lines[$start..$end] | Set-Content release-notes.md
      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*-setup.exe
          body_path: release-notes.md
